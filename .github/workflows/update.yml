name: Обновление данных sms.ru

on:
  schedule:
    - cron: "0 6 * * *"  # 09:00 МСК каждый день
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sms-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Запросить данные у sms.ru
        env:
          SMSRU_API_ID: ${{ secrets.SMSRU_API_ID }}
        run: python3 sms_dashboard.py update

      - name: Сохранить данные в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Обновление данных sms.ru"
          git push
